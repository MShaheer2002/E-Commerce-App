name: e_commerce_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  flutter_dotenv: ^6.0.0
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^7.0.1
  go_router: ^15.1.2
  flutter_svg: ^2.1.0
  fluttertoast: ^8.2.6
  carousel_slider: ^5.1.1
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.0.3
  flutter_native_splash: ^2.4.4
  shared_preferences: ^2.5.3
  image_picker: ^1.2.0
  intl_phone_field: ^3.2.0
  flutter_stripe: ^12.0.2
  firebase_storage: ^13.0.3
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.5.0
  permission_handler: ^12.0.1
  iconsax: ^0.0.8
  pull_to_refresh: ^2.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/svgs/
    - assets/images/
    - assets/images/titles/
    - assets/empty_data_icons/
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/urbanist/Urbanist-Regular.ttf
        - asset: assets/fonts/urbanist/Urbanist-Italic.ttf
          style: italic
        - asset: assets/fonts/urbanist/Urbanist-Bold.ttf
          weight: 500

# 👇 Keep both at root level (outside `flutter:`)
flutter_native_splash:
  color: "#000000"
  image: assets/images/applogo.png
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/appIcon.png"
  min_sdk_android: 21
